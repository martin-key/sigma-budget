# Checks, build and deployment of the site (README „Сглобяване и публикуване“).
#   pull request to develop or main  -> the registries, data validation, prerender build with its page checks, the v6 checks of the app,
#                                       and a build of the pinned data image
#   push to develop                  -> the same, then deploy dist/ to the staging Worker (noindex)
#   push to main                     -> the same checks; nothing is deployed
# This workflow never deploys to production: that is a separate, controlled procedure (docs/approach-specification.md, section 11, stage E).
# The staging deployment needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and the variable STAGING_ORIGIN
# (the staging Worker's address); without them the deploy step is skipped.
name: site

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install tools
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m playwright install --with-deps chromium
      - name: Check the source and dataset registries
        run: python tools/data/registry.py check
      - name: Check the published release (site/data against its manifest)
        run: ./budget validate --site
      - name: Validate the data
        run: python tools/mock/validate_data_v6.py
      - name: Build and check every page
        env:
          ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://sigma-budget.my-data.bg' }}
        run: python tools/site/build.py --origin "$ORIGIN" --noindex
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  check:
    # The v6 checks of the app (hash mode, the expected figures read from site/data/execution.json): all of them block, and the
    # staging deployment waits for them. The full check_mock_v6 also covers 400 px and keyboard paths.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers   # the checks look there first (redirects_v6 and others set it as their default)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m playwright install --with-deps chromium
      - name: Screens, accessibility and layout
        run: python tools/mock/check_mock_v6.py
      - name: Old addresses
        run: python tools/mock/redirects_v6.py
      - name: Tax calculator
        run: python tools/mock/calc_check_v6.py
      - name: Sharing and export
        run: python tools/mock/share_check_v6.py
      - name: Acceptance figures
        run: python tools/mock/accept_v6.py
      - name: Motion
        run: python tools/mock/motion_v6.py

  data-image:
    # the pinned environment of the data processing (tools/data/Dockerfile): it must build from its digest and hash-locked
    # dependencies. Running it needs the raw files, which are not in the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sigma-budget-data tools/data
      - run: docker run --rm sigma-budget-data python -c "import fitz, xlrd, yaml, docx, pdfplumber, py7zr; print(fitz.VersionBind)"

  deploy:
    needs: [build, check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set: skipping the deployment."
            exit 0
          fi
          npx --yes wrangler@4 deploy --env staging
