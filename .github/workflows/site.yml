# Checks, build and deployment of the site (README „Сглобяване и публикуване“; docs/adr/0002-react-router-ssr.md).
#   pull request to main             -> offline release integrity, the TypeScript check, the build of the Worker (React Router SSR)
#                                       with every screen checked as the server sends it and as the browser shows it, the browser checks of the
#                                       app (screens against the built Worker) and local release compatibility
#   push to main                     -> the same, then deploy the built Worker to staging (noindex)
#   push of a v* tag                  -> the same, then deploy production through the production environment's approval
# There is no develop branch. Production is deployed only from a version tag (docs/production-procedure.md).
# Each GitHub Environment holds its own CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
# Staging also uses STAGING_ORIGIN. Missing staging secrets skip deployment with a notice; missing production secrets fail.
name: site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          target=''
          if [ "$EVENT_NAME" = push ]; then
            if [[ "$REF" == refs/tags/v* ]]; then
              target=production
            elif [ "$REF" = refs/heads/main ]; then
              target=staging
            fi
          fi
          echo "environment=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.pick.outputs.environment == 'production'
        with:
          fetch-depth: 0
      - name: Require a version tag on main for production
        if: steps.pick.outputs.environment == 'production'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production requires a tag matching vX.Y.Z (numeric major, minor and patch)."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit must be an ancestor of origin/main."
            exit 1
          fi

  security:
    needs: [target]
    uses: ./.github/workflows/security.yml

  coverage:
    needs: [target]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install tools
        run: pnpm install --frozen-lockfile
      - name: Coverage gate self-tests
        run: node --test scripts/check-coverage.test.mjs scripts/ci-gates.test.mjs scripts/ci-install-browser.test.mjs
      - name: Coverage baseline ratchet against target
        env:
          COVERAGE_BASE_REF: ${{ github.base_ref }}
          COVERAGE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-coverage.mjs --check-base
      - name: All Node suites, once, with coverage
        run: pnpm test -- --coverage
      - name: Node tests leave protected inputs unchanged
        if: always()
        run: test -z "$(git status --porcelain -- data apps/web/app/routes/__fixtures__)"
      - name: Per-workspace regression gate
        run: pnpm check:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage-summary.md
            apps/*/coverage/coverage-summary.json
          if-no-files-found: error

  build:
    needs: [target]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install tools
        run: |
          pnpm install --frozen-lockfile
      - name: Install the Chromium of the pinned Playwright
        run: bash scripts/ci-install-browser.sh
      - name: Check repository formatting
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Offline pinned release integrity
        run: pnpm data:check
      - name: Compatibility of code and data (stage E)
        run: node tests/release/compat_check.mjs
      - name: Build the Worker for the target and check every screen
        env:
          TARGET: ${{ needs.target.outputs.environment }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://sigma-budget-staging.cf-midt.workers.dev' }}
        run: |
          if [ "$TARGET" = production ]; then
            pnpm build:release --origin https://sigma-budget.midt.bg
          else
            pnpm build:release --env staging --origin "$STAGING_ORIGIN" --noindex
          fi
      - name: The checks and the build leave data/release unchanged
        run: test -z "$(git status --porcelain -- data/release)" || { git status --short -- data/release; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: apps/web/build
          retention-days: 7

  check:
    # The browser checks of the app (hash mode, the expected figures read from data/release/execution.json): all of them block, and the
    # deployment waits for them. The full screens also covers 400 px and keyboard paths; it runs against the built Worker
    # (the screens drawn on the server, then taken over by the app), the others test the app on the composed static site in tmp/.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tmp/pw-browsers # the checks look there first (redirects and others set it as their default)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
      - name: Install the Chromium of the pinned Playwright
        run: bash scripts/ci-install-browser.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
          path: apps/web/build
      - name: Screens, accessibility and layout (against the built Worker)
        run: |
          pnpm exec wrangler dev -c apps/web/build/server/wrangler.json --ip 127.0.0.1 --port 8814 --persist-to "$RUNNER_TEMP/state" > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8814/robots.txt && break; sleep 1; done
          E2E_WORKER_URL=http://127.0.0.1:8814 pnpm test:e2e --project=worker visual-audit.spec.ts
          E2E_WORKER_URL=http://127.0.0.1:8814 pnpm test:e2e --project=worker light-contrast.spec.ts
      - name: Screen audits, states, variants and checker self-test (Playwright Test)
        run: E2E_WORKER_URL=http://127.0.0.1:8814 pnpm test:e2e --project=worker screens-base.spec.ts screens-demo.spec.ts screens-variants.spec.ts screens-selftest.spec.ts
      - name: Screen navigation, sharing, shell, glossary, tabs and views
        run: E2E_WORKER_URL=http://127.0.0.1:8814 pnpm test:e2e --project=worker screens-tour.spec.ts screens-sharing.spec.ts screens-shell.spec.ts screens-glossary.spec.ts screens-tabs.spec.ts screens-views.spec.ts
      - name: Early boot, server DOM adoption and cross-origin security (Playwright Test)
        run: E2E_WORKER_URL=http://127.0.0.1:8814 pnpm test:e2e --project=worker boot.spec.ts narrative-adoption.spec.ts security-headers.spec.ts
      - name: Annual periods, aliases, SSR notices and stored preferences
        run: E2E_WORKER_URL=http://127.0.0.1:8814 pnpm test:e2e --project=worker period-matrix.spec.ts
      - name: Current-bill lists, shared units and navigation
        run: E2E_WORKER_URL=http://127.0.0.1:8814 pnpm test:e2e --project=worker public-bill-lists.spec.ts share-units.spec.ts react-bridge.spec.ts
      - name: Old addresses
        run: pnpm test:e2e --project=static redirects.spec.ts
      - name: Tax calculator
        run: pnpm test:e2e --project=static calc.spec.ts
      - name: Sharing and export
        run: pnpm test:e2e --project=static share.spec.ts
      - name: Acceptance figures
        run: pnpm test:e2e --project=static accept.spec.ts overlap.spec.ts
      - name: Motion
        run: pnpm test:e2e --project=static motion.spec.ts
      # A failed test step prevents subsequent default-success test steps from
      # running, so a later Playwright invocation cannot clean its failure traces.
      - name: Upload failed Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-results
          path: tmp/e2e-results
          if-no-files-found: ignore

  release:
    needs: [target]
    # Local compatibility and deployed-site response checks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/release/compat_check.test.mjs scripts/check-deployment.test.mjs

  required-validation:
    if: ${{ always() }}
    needs: [target, security, coverage, build, check, release]
    runs-on: ubuntu-latest
    steps:
      - name: Every validation must succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: node -e 'const r=JSON.parse(process.env.RESULTS); if (!r.length || r.some(x => x !== "success")) process.exit(1)'

  deploy:
    needs: [required-validation, target]
    if: needs.target.outputs.environment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.target.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a version tag on main for production
        if: needs.target.outputs.environment == 'production'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production requires a tag matching vX.Y.Z (numeric major, minor and patch)."
            exit 1
          fi
          git fetch origin main --tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit must be an ancestor of origin/main."
            exit 1
          fi
          highest=$(git tag -l 'v*' --sort=-v:refname | sed -n '1p')
          if [ "$TAG" != "$highest" ]; then
            echo "::error::Production requires the highest v* version tag ($highest). Use wrangler rollback for intentional rollbacks."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
          path: apps/web/build
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      # the wrangler pinned in pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Require environment deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ needs.target.outputs.environment }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ "$TARGET" = production ]; then
              echo "::error::Production Cloudflare secrets are not set: a version tag must deploy."
              exit 1
            fi
            echo "::notice::Cloudflare secrets are not set: skipping the deployment."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Resolve the deployment origin
        if: steps.credentials.outputs.ready == 'true'
        id: deployment-origin
        env:
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
          TARGET: ${{ needs.target.outputs.environment }}
        run: |
          if [ "$TARGET" = production ]; then
            origin=https://sigma-budget.midt.bg
          else
            if [ -z "$STAGING_ORIGIN" ]; then
              echo "::error::The variable STAGING_ORIGIN is not set: the deployment cannot be verified, so nothing is deployed."
              exit 1
            fi
            origin="$STAGING_ORIGIN"
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - name: Deploy to the target Worker
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c apps/web/build/server/wrangler.json
      - name: Verify the deployed site and release identity
        if: steps.credentials.outputs.ready == 'true'
        env:
          ORIGIN: ${{ steps.deployment-origin.outputs.origin }}
        run: node scripts/check-deployment.mjs --origin "$ORIGIN"
