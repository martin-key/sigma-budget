title = "СИГМА Бюджет secret scan"
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed 2026-11-11: public fiscal period identifiers, not credentials; exact secret values only."
regexTarget = "secret"
regexes = ['''^202[89]\.forecast$''']

[[rules.allowlists]]
description = "Reviewed 2026-11-12: SHA-256 of the locked esbuild API file (compiler identity apiSha256) in release manifests; exact value only."
condition = "AND"
paths = ['''data/release/releases/[a-f0-9]{64}/manifest\.json$''']
regexTarget = "secret"
regexes = ['''^61ec0ba144ff93f4bf0e96ad6fab6f430ede0aa13e27ace8063ed63ba416b3cd$''']
