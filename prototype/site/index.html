<title>Бюджет на светло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --sunk:#EEF2F6; --ink:#15202B; --muted:#586575; --line:#DAE1E8;
  --accent:#E3A008; --accent-soft:#FDF3D7; --accent-ink:#7A5300;
  --data:#2F5D9A; --data-2:#9DB9DD; --data-3:#C9D6E6;
  --rev:#2F5D9A; --exp:#C4532C; /* приходи / разходи в графиката за изпълнението */
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warn:#A8670A; --warn-soft:#FBEFD9; --unk:#8A5A6B; --unk-soft:#F4E8EC;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 16px rgba(21,32,43,.06);
  --display:"Sofia Sans Condensed","Sofia Sans","Arial Narrow",system-ui,sans-serif;
  --body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E141B; --surface:#151E28; --sunk:#1B2632; --ink:#E6EDF3; --muted:#9AA8B6; --line:#283543;
    --accent:#F2B92E; --accent-soft:#3A2F12; --accent-ink:#F5CB64;
    --data:#7FA8E0; --data-2:#3F6497; --data-3:#2A3D57;
    --rev:#5B8FDB; --exp:#D96C45;
    --ok:#6CC08F; --ok-soft:#173226; --warn:#E3A94A; --warn-soft:#3A2C12; --unk:#D59AAE; --unk-soft:#3A2230;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141B; --surface:#151E28; --sunk:#1B2632; --ink:#E6EDF3; --muted:#9AA8B6; --line:#283543;
  --accent:#F2B92E; --accent-soft:#3A2F12; --accent-ink:#F5CB64;
  --data:#7FA8E0; --data-2:#3F6497; --data-3:#2A3D57;
  --rev:#5B8FDB; --exp:#D96C45;
  --ok:#6CC08F; --ok-soft:#173226; --warn:#E3A94A; --warn-soft:#3A2C12; --unk:#D59AAE; --unk-soft:#3A2230;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.2vw,2.9rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.01em}
.brand-mark{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6D8 0,var(--accent) 55%,#B57A00 100%);box-shadow:0 0 0 4px var(--accent-soft)}
.demo-pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.spacer{flex:1}
.src-toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.src-toggle .dot{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.src-toggle .dot::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .2s}
.src-toggle[aria-pressed="true"] .dot{background:var(--accent)}
.src-toggle[aria-pressed="true"] .dot::after{transform:translateX(12px)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1320px;margin:0 auto}
.nav{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto;padding:18px 14px 30px;border-right:1px solid var(--line)}
.nav a{display:block;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted);line-height:1.3}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.nav .group{margin:14px 12px 6px}
.nav .phase{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
main{padding:28px clamp(16px,3vw,40px) 90px;min-width:0}
.page{max-width:1040px;display:grid;gap:28px}
.lede{font-size:1.15rem;max-width:62ch}
.tabbar{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .nav{display:none}
  .demo-pill{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;text-align:center;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--muted);padding:8px 4px;border-radius:8px}
  .tabbar a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
  .topbar{padding:10px 16px}
  .src-toggle span.lbl{display:none}
}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid-3,.grid-2,.grid-4{grid-template-columns:1fr}#expChartWrap{grid-template-columns:1fr!important}}
.kpi .label{font-size:.9rem;color:var(--muted);font-weight:600}
.kpi .value{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:1rem;font-weight:700;margin-left:4px}
.kpi .sub{font-size:.9rem;color:var(--muted);margin-top:6px}
.sentence{font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,2.9vw,2.05rem);line-height:1.25;max-width:34ch}
.sentence b{color:var(--accent-ink);font-weight:800;white-space:nowrap}
.scope{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 8px}

/* progress */
.prog{display:grid;gap:14px}
.prog-row{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:12px;align-items:center}
.bar{position:relative;height:14px;background:var(--sunk);border-radius:7px;overflow:visible}
.bar > i{position:absolute;inset:0 auto 0 0;background:var(--data);border-radius:7px}
.bar .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--accent)}
.bar .mark span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.72rem;font-weight:700;color:var(--accent-ink);white-space:nowrap}
.prog-row .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* question cards */
.qcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.qcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.qcards{grid-template-columns:1fr}}
.qcard{display:grid;gap:4px;text-decoration:none;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,transform .15s}
.qcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.qcard b{font-family:var(--display);font-size:1.15rem}
.qcard span{font-size:.9rem;color:var(--muted)}
.qcard.p2{opacity:.6}

/* source badges */
.src{display:none;margin:-4px 0 12px;font-size:.82rem;line-height:1.35;padding:6px 10px;border-radius:6px;border-left:3px solid}
body.show-src .src{display:flex;gap:8px;align-items:flex-start}
.src b{white-space:nowrap}
.src span{min-width:0;overflow-wrap:anywhere}
.src[data-st="ok"]{background:var(--ok-soft);border-color:var(--ok)}
.src[data-st="ok"] b{color:var(--ok)}
.src[data-st="warn"]{background:var(--warn-soft);border-color:var(--warn)}
.src[data-st="warn"] b{color:var(--warn)}
.src[data-st="unk"]{background:var(--unk-soft);border-color:var(--unk)}
.src[data-st="unk"] b{color:var(--unk)}
.st{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.unk{background:var(--unk-soft);color:var(--unk)}

/* charts & tables */
.chart{width:100%;height:340px}
.chart.tall{height:420px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td:first-child{padding-left:28px;color:var(--muted)}
.hbar{height:8px;background:var(--sunk);border-radius:4px;margin-top:6px;min-width:60px}
.hbar i{display:block;height:100%;background:var(--data);border-radius:4px}

/* stacked 100 bar */
.stack{display:flex;height:48px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.stack > div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

details.row{border-bottom:1px solid var(--line);padding:10px 0}
details.row summary{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:baseline;list-style:none;font-weight:600}
details.row summary::-webkit-details-marker{display:none}
details.row summary::before{content:"▸";color:var(--muted);margin-right:6px;display:inline-block;transition:transform .15s}
details.row[open] summary::before{transform:rotate(90deg)}
details.row .body{padding:8px 0 4px 18px;color:var(--muted);display:grid;gap:4px;max-width:70ch}

/* list rows (ministries) */
.search{width:100%;max-width:380px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mlist{display:grid}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 16px;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none;align-items:center}
.mrow:hover{background:var(--sunk)}
.mrow .nm{font-weight:600}
.mrow .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mrow .hbar{grid-column:1 / -1;margin-top:0}
.mrow .tag{font-size:.75rem;color:var(--muted);font-weight:600}

/* calculator */
.calc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:.92rem}
.field input[type="number"]{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:1.1rem;font-variant-numeric:tabular-nums;width:100%}
.radio{display:grid;gap:6px}
.radio label{display:flex;gap:8px;align-items:center;font-weight:500}
.radio label.off{color:var(--muted)}
.receipt{font-family:var(--body)}
.receipt .line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.receipt .line b{font-variant-numeric:tabular-nums}
.receipt .total{font-family:var(--display);font-size:1.6rem;font-weight:800}
.share{border:1px solid var(--line);border-radius:12px;padding:18px;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.share p{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.3}

/* map */
.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.mapgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mapgrid{grid-template-columns:1fr}}
.mapcard{display:grid;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.mapcard:hover{border-color:var(--accent)}
.mapcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mapcard b{font-family:var(--display);font-size:1.1rem}
.mapcard .kind{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mapcard .st-row{display:flex;gap:6px;flex-wrap:wrap}
ol.qs{margin:0;padding-left:22px;display:grid;gap:8px;max-width:75ch}
.note{font-size:.88rem;color:var(--muted);max-width:75ch}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0;max-width:75ch}
.p2box{border:1px dashed var(--line);border-radius:12px;padding:24px;background:var(--sunk)}

/* разбивка на функциите и „По години“ */
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-height:34px;margin-bottom:8px;font-size:.9rem}
.crumb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:.86rem}
.crumb:hover{border-color:var(--accent)}
.crumb-here{font-weight:700}
.part{padding:8px 0;border-bottom:1px dashed var(--line)}
.part .line{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.part .line b{white-space:nowrap;font-variant-numeric:tabular-nums}
.part .hbar{margin-top:5px}
.psub{font-size:.82rem;color:var(--muted);margin-top:3px}
.xbtn{display:inline-flex;gap:6px;align-items:baseline;border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600}
.xbtn .tw{color:var(--muted);display:inline-block;width:12px}
.xpad{display:inline-block;padding-left:18px}
.linkish{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.yr-controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;max-width:100%}
.yr-sum{font-size:1.02rem;max-width:70ch}
table.yr-table{font-size:.88rem}
table.yr-table th,table.yr-table td{padding:7px 8px}
tr.on td{background:var(--accent-soft)}

/* изпълнение по месеци */
details.tbl{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.tbl summary{cursor:pointer;font-weight:600;list-style:none;width:fit-content}
details.tbl summary::-webkit-details-marker{display:none}
details.tbl summary::before{content:"▸";color:var(--muted);margin-right:6px;display:inline-block;transition:transform .15s}
details.tbl[open] summary::before{transform:rotate(90deg)}
details.tbl .table-wrap{margin-top:8px}
details.tbl td .psub{margin-top:1px}
tr.plan td{border-bottom:0;border-top:2px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div lang="bg">
<header class="topbar">
  <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Бюджет на светло</a>
  <span class="demo-pill">Прототип v2 · реални и примерни данни</span>
  <span class="spacer"></span>
  <button class="src-toggle" id="srcToggle" type="button" aria-pressed="false" aria-label="Покажи източниците"><span class="dot" aria-hidden="true"></span><span class="lbl">Покажи източниците</span></button>
</header>

  <main id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Основни раздели"></nav>
</div>

const DARK_INK = "#15202B";
function luminance(hex) {
  let h = hex.replace("#", "");
  if (h.length === 3) h = h.replace(/./g, "$&$&");
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function textOn(bg) {
  if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(bg)) return "#fff";
  const L = luminance(bg);
  return (L + 0.05) / (luminance(DARK_INK) + 0.05) > 1.05 / (L + 0.05) ? DARK_INK : "#fff";
}

/* Графика: treemap по функции; клик разгъва функцията на подредовете ѝ. */
const TM_LINE = 16; // височина на ред в надписите на полетата, px
const tmMeasure = (() => {
  let cx = null;
  return s => { cx = cx || document.createElement("canvas").getContext("2d"); cx.font = "700 13px 'Sofia Sans Condensed', system-ui, sans-serif"; return cx.measureText(s).width; };
})();
// Побира ли се надписът „име + сума“ в поле w×h, без да се чупят думи?
function tmLabelFits(name, value, w, h) {
  const maxW = w - 14, words = name.split(/\s+/);
  if (Math.max(tmMeasure(value), ...words.map(tmMeasure)) > maxW) return false;
  const sp = tmMeasure(" ");
  let lines = 1, cur = 0;
  for (const wd of words) {
    const ww = tmMeasure(wd);
    if (!cur) cur = ww; else if (cur + sp + ww <= maxW) cur += sp + ww; else { lines++; cur = ww; }
  }
  return (lines + 1) * TM_LINE <= h - 10;
}
function drawTreemap() {
  const el = document.getElementById("treemap");
  const c = mkChart(el);
  const pal = [css("--data"), css("--data-2"), css("--accent"), css("--data-3"), css("--ok"), css("--warn"), css("--unk"), css("--muted"), css("--data-2")];
  tmPaint = () => {
    const f = FUNCTIONS[expSel];
    const open = expOpen && f.parts.length > 0;
    const items = open ? f.parts : FUNCTIONS;
    const valText = x => open ? mlnFmt(x.m) : fmt(x.m / 1000) + " млрд. €";
    const color = i => open ? pal[expSel % pal.length] : pal[i % pal.length]; // подредовете носят цвета на функцията
    const data = fit => items.map((x, i) => ({ name: x.short, value: x.m,
      label: { show: !fit || fit[x.short] !== false, color: textOn(color(i)) },
      itemStyle: { color: color(i), borderColor: !open && i === expSel ? css("--ink") : css("--surface") } }));
    c.setOption({
      tooltip: { formatter: p => { const x = items.find(it => it.short === p.name); return x ? `${x.name}<br><b>${mlnFmt(x.m)}</b>` : ""; } },
      series: [{ type: "treemap", roam: false, nodeClick: false, breadcrumb: { show: false }, width: "100%", height: "100%", top: 0, left: 0,
        label: { show: true, formatter: p => { const x = items.find(it => it.short === p.name); return x ? `${x.short}\n${valText(x)}` : p.name; }, fontFamily: "Sofia Sans Condensed, system-ui", fontWeight: 700, fontSize: 13, lineHeight: TM_LINE, overflow: "break", lineOverflow: "truncate" },
        itemStyle: { borderColor: css("--surface"), borderWidth: 3, gapWidth: 3 },
        data: data(null) }]
    }, true);
    // Втори пас: надпис само в полетата, където се побира цял; иначе думите се чупят на букви.
    // Сумите на скритите надписи остават в подсказката, в детайла и в таблицата.
    try {
      const fit = {};
      c.getModel().getSeriesByIndex(0).getViewRoot().children.forEach(n => {
        const x = items.find(it => it.short === n.name), l = n.getLayout();
        if (x && l) fit[x.short] = tmLabelFits(x.short, valText(x), l.width, l.height);
      });
      c.setOption({ series: [{ data: data(fit) }] });
    } catch (e) { /* без размерите оставяме всички надписи */ }
    el.setAttribute("aria-label", open ? `${f.name}: подредовете в таблицата по КФП, пропорционални на сумата` : "Разходи по функции, пропорционални на сумата");
    document.getElementById("crumbs").innerHTML = open
      ? `<button type="button" class="crumb" id="tmBack">← Всички функции</button><span class="crumb-here">${f.short} · ${fmt(f.v)} млрд. €</span>`
      : `<span class="muted">Всички функции · ${fmt(FUNC_TOTAL)} млрд. €</span>`;
    const back = document.getElementById("tmBack");
    if (back) back.onclick = () => { expOpen = false; tmPaint(); showDetail(); };
  };
  tmPaint();
  showDetail();
  // Размерите на надписите зависят от шрифта: пренареди, щом се зареди.
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => { if (!c.isDisposed()) tmPaint(); });
  // dataIndex в treemap брои и скрития корен (първото поле е 1), затова търсим по име.
  c.on("click", p => {
    if (expOpen && FUNCTIONS[expSel].parts.length) return; // под подредовете няма публикувано ниво (фаза 2)
    const k = FUNCTIONS.findIndex(f => f.short === p.name);
    if (k < 0) return;
    expSel = k; yrTotal = false; expOpen = FUNCTIONS[k].parts.length > 0;
    tmPaint(); showDetail();
  });
}

   ${parts}
   <p style="margin-top:12px"><button type="button" class="linkish" id="fYears">Виж по години →</button></p>
   <div style="margin-top:14px">${src("activities")}<p class="note">Следващо ниво — около 400–500 дейности. Тази разбивка я има само в МФ и не е публикувана. <span class="st warn">фаза 2</span></p></div>`;

/* Таблица: функциите се разгъват на подредовете си. */
function expTableRows() {
  const row = (x, cls, first) => `<tr class="${cls}">${first}<td class="r">${mlnFmt(x.m)}</td><td class="r">${fmt(x.m / (FUNC_TOTAL * 1000) * 100)}%</td><td class="r">${ppFmt(x.m / 1000)} €</td><td class="r">${signPct(x.yoy)}</td></tr>`;
  return FUNCTIONS.map((f, i) => {
    const open = expRows.has(i);
    const name = f.parts.length
      ? `<button type="button" class="xbtn" data-row="${i}" aria-expanded="${open}"><span class="tw" aria-hidden="true">${open ? "▾" : "▸"}</span><span>${f.name}</span></button>`
      : `<span class="xpad">${f.name}</span>`;
    return row(f, "", `<td>${name}</td>`) + (open ? f.parts.map(p => row(p, "sub", `<td>${p.name}</td>`)).join("") : "");
  }).join("");
}
function wireExpTable() {
  document.querySelectorAll("[data-row]").forEach(b => { b.onclick = () => {
    const i = +b.dataset.row;
    if (expRows.has(i)) expRows.delete(i); else expRows.add(i);
    expSel = i; yrTotal = false; expOpen = false;
    document.getElementById("expTbody").innerHTML = expTableRows();
    wireExpTable();
    const again = document.querySelector(`[data-row="${i}"]`);
    if (again) again.focus();
  }; });
}

/* По години: Eurostat COFOG за избраната функция + таблица с всички групи. */
function yearsHtml() {
  const f = FUNCTIONS[expSel];
  const codes = yrTotal ? ["TOTAL"] : f.cofog;
  const pct = yrUnit === "PC_GDP";
  const vals = cofogSeries(codes, yrUnit);
  const ys = COFOG.years, n = ys.length - 1;
  const show = v => pct ? `${fmt(v)}% от БВП` : mlnFmt(v);
  const d = vals[n] - vals[0];
  const chg = pct ? (Math.abs(d) < 0.05 ? "без промяна" : `${d > 0 ? "+" : "−"}${fmt(Math.abs(d))} пр.п.`) : signPct((vals[n] / vals[0] - 1) * 100);
  const label = yrTotal ? "Всички разходи" : f.name;
  const opts = FUNCTIONS.map((x, i) => `<option value="${i}">${x.short}</option>`).join("") + `<option value="-1">Всички разходи</option>`;
  const rows = FUNCTIONS.map((x, i) => ({ i, name: x.short, codes: x.cofog })).concat([{ i: -1, name: "Всички разходи", codes: ["TOTAL"] }]);
  const cell = v => pct ? fmt(v) : fmt0(v);
  const trs = rows.map(r => {
    const on = r.i < 0 ? yrTotal : !yrTotal && r.i === expSel;
    return `<tr class="${on ? "on" : ""}"><td><button type="button" class="linkish" data-yr="${r.i}">${r.name}</button></td><td class="muted" style="white-space:nowrap">${cofogCodes(r.codes)}</td>${cofogSeries(r.codes, yrUnit).map(v => `<td class="r">${cell(v)}</td>`).join("")}</tr>`;
  }).join("");
  return `
    <div class="yr-controls">
      <label for="yrSel" style="font-weight:600">Функция</label>
      <select id="yrSel" class="sel">${opts}</select>
      <div class="seg" role="group" aria-label="Мерна единица"><button type="button" id="uMio" aria-pressed="${!pct}">млн. €</button><button type="button" id="uPct" aria-pressed="${pct}">% от БВП</button></div>
    </div>
    <p class="yr-sum"><b>${label}</b>: ${show(vals[0])} през ${ys[0]} г. → <b>${show(vals[n])}</b> през ${ys[n]} г. (${chg}).</p>
    <p class="note" style="margin-top:4px">По COFOG това е ${cofogText(codes)}.</p>
    <div id="yrChart" class="chart" role="img" aria-label="${label}: разходи по години, ${ys[0]}–${ys[n]}"></div>
    <div class="callout" style="margin:6px 0 18px"><b>COFOG не е КФП.</b> Годините са по международната класификация COFOG на Eurostat: сектор „Държавно управление“, на начислена основа. Групите се различават леко от функциите по КФП. Например в COFOG лихвите по дълга са част от „Общи държавни служби“ (GF0107), а тук ги показваме отделно. Затова сумите не съвпадат с тези за 2026 г. Последната налична година е ${ys[n]}.</div>
    <h3 style="margin-bottom:8px">Всички групи, ${pct ? "% от БВП" : "млн. €"}</h3>
    <div class="table-wrap"><table class="yr-table"><thead><tr><th>Група</th><th>COFOG</th>${ys.map(y => `<th class="r">${y}</th>`).join("")}</tr></thead><tbody>${trs}</tbody></table></div>`;
}
function drawYears() {
  const sel = document.getElementById("yrSel");
  sel.value = yrTotal ? "-1" : String(expSel);
  const pick = k => { if (k < 0) yrTotal = true; else { yrTotal = false; expSel = k; expOpen = false; } rerender(); };
  sel.onchange = () => pick(+sel.value);
  document.querySelectorAll("[data-yr]").forEach(b => { b.onclick = () => pick(+b.dataset.yr); });
  document.getElementById("uMio").onclick = () => { yrUnit = "MIO_EUR"; rerender(); };
  document.getElementById("uPct").onclick = () => { yrUnit = "PC_GDP"; rerender(); };
  const pct = yrUnit === "PC_GDP";
  const vals = cofogSeries(yrTotal ? ["TOTAL"] : FUNCTIONS[expSel].cofog, yrUnit);
  const last = vals.length - 1;
  const tip = v => pct ? `${fmt(v)}% от БВП` : `${fmt(v)} млн. €`;
  const lab = v => pct ? `${fmt(v)}%` : fmt0(v);
  const t = baseText();
  const c = mkChart(document.getElementById("yrChart"));
  c.setOption({

function receiptHtml() {

  const rows = FUNCTIONS.map(f => { const y = yearly * f.v / FUNC_TOTAL; return `<tr><td>${f.short}</td><td class="r">${fmt0(y)} €</td><td class="r">${fmt(y / 365, 2)} €</td></tr>`; }).join("");
  const top3 = FUNCTIONS.slice(0, 3).map(f => `${fmt0(f.v / FUNC_TOTAL * 100)} € за ${f.short.toLowerCase()}`).join(", ");
  return `
  <div class="panel receipt" style="display:grid;gap:14px">
    <div><div class="eyebrow">Колко плащаш годишно</div><div class="total num">≈ ${fmt0(yearly)} €</div><p class="muted">преки данъци и осигуровки${useVat ? " + ДДС от покупките" : ""}</p></div>

function drawDebt() {
  const t = baseText();
  const years = Object.keys(DEBT.BG).sort();
  const c = mkChart(document.getElementById("debtChart"));
  c.setOption({
    grid: { left: 44, right: 24, top: 40, bottom: 32 },
    legend: { top: 0, left: 0, textStyle: t, data: ["България", "Средно за ЕС"] },
    tooltip: { trigger: "axis", valueFormatter: v => `${fmt(v)}%` },
    xAxis: { type: "category", data: years, axisLabel: t, axisLine: { lineStyle: { color: css("--line") } } },
    yAxis: { type: "value", max: 100, axisLabel: { ...t, formatter: "{value}%" }, splitLine: { lineStyle: { color: css("--line") } } },
    series: [
      { name: "България", type: "line", data: years.map(y => DEBT.BG[y]), symbolSize: 7, lineStyle: { width: 3, color: css("--accent") }, itemStyle: { color: css("--accent") },
        markLine: { symbol: "none", silent: true, label: { formatter: "лимит 60%", color: css("--muted"), position: "insideEndTop" }, lineStyle: { color: css("--unk"), type: "dashed" }, data: [{ yAxis: 60 }] } },
      { name: "Средно за ЕС", type: "line", data: years.map(y => DEBT.EU27_2020[y]), symbolSize: 5, lineStyle: { width: 2, color: css("--data") }, itemStyle: { color: css("--data") } }
    ]
  });
  const bar = (id, vals, color, neg) => {
    const ch = mkChart(document.getElementById(id));
    ch.setOption({
      grid: { left: 40, right: 12, top: 24, bottom: 44 },
      tooltip: { trigger: "axis", valueFormatter: v => `${fmt(v, 2)} млрд. €` },
      xAxis: { type: "category", data: BAL.years.map((y, i) => `${y}\n${BAL.kind[i]}`), axisLabel: { ...t, fontSize: 11 }, axisLine: { lineStyle: { color: css("--line") } } },
      yAxis: { type: "value", axisLabel: t, splitLine: { lineStyle: { color: css("--line") } } },
      series: [{ type: "bar", data: vals.map((v, i) => ({ value: v, itemStyle: { color: i === 2 ? css("--accent") : color, borderRadius: neg ? [0, 0, 4, 4] : [4, 4, 0, 0] } })), barWidth: "52%",
        label: { show: true, position: neg ? "bottom" : "top", color: css("--ink"), fontWeight: 700, formatter: p => fmt(p.value, neg ? 1 : 2) } }]
    });
  };
  bar("balChart", BAL.bal, css("--data-2"), true);
  bar("intChart", BAL.int, css("--data-2"), false);
}

function pData() {
  const keys = Object.keys(SRC);

  const rows = keys.map(k => `<tr><td><b>${names[k]}</b></td><td>${stPill(k)}</td><td class="muted">${SRC[k][1]}</td></tr>`).join("");
  return `
  <header style="display:grid;gap:10px"><div class="eyebrow">Справка</div><h1>Откъде са данните</h1><p class="lede muted">Всяко число в прототипа има източник и статус. Включи „Покажи източниците“ горе вдясно, за да ги видиш на всеки екран.</p></header>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>Набор</th><th>Статус</th><th>Източник и бележки</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="panel"><h2 style="margin-bottom:10px">Капани</h2><ul style="margin:0;padding-left:20px;display:grid;gap:8px;max-width:75ch">
    <li><b>Евро и лева.</b> От 01.01.2026 всичко е в евро, а историята е в лева. Делим на 1,95583. В SDMX файла на МФ двете валути са смесени под един и същ код.</li>
    <li><b>Обхват.</b> „Държавен бюджет“ не е същото като КФП. Етикетът за обхвата стои до всяка сума.</li>
    <li><b>Функции по КФП и COFOG.</b> Функциите по КФП са национална класификация на касова основа. Изгледът „По години“ ползва COFOG на Eurostat (начислена основа, сектор „Държавно управление“), където някои разходи са групирани другояче. Например лихвите по дълга в COFOG са в „Общи държавни служби“.</li>
    <li><b>Достъп.</b> data.egov.bg и minfin.bg блокират автоматичния достъп. За автоматично обновяване трябва договорен достъп или собствен архив.</li></ul></section>`;
}
